# Pubblica il sito su GitHub Pages a ogni push sul ramo main (e a mano dalla scheda Actions).
# Indirizzo: https://napolepaolo.github.io/ProgettoCase3D/
#
# Prima volta: nel repository, Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Con un dominio proprio: cambia SITE_URL (es. https://3dbuilding.farelab.it) e metti BASE_PATH: /

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; quella in corso non viene interrotta.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://napolepaolo.github.io
  BASE_PATH: /ProgettoCase3D/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v5
